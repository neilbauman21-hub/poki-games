<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Subway Surfers</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#game{width:100%;height:100%;border:0;display:block}
#status{color:#eee;font:16px system-ui,sans-serif;padding:24px}
</style>
</head>
<body>
<p id="status">Starting game...</p>
<iframe id="game" src="about:blank" allow="autoplay; fullscreen; gamepad; accelerometer; gyroscope" allowfullscreen="allowfullscreen"></iframe>
<script type="text/javascript"><![CDATA[
(async function () {
  const status = document.getElementById("status");
  const frame = document.getElementById("game");
  if (!("serviceWorker" in navigator)) throw new Error("Service workers are required.");
  await navigator.serviceWorker.register("./sw.js");
  await navigator.serviceWorker.ready;
  if (!navigator.serviceWorker.controller) {
    await new Promise(function (resolve) {
      navigator.serviceWorker.addEventListener("controllerchange", resolve, {once: true});
      setTimeout(resolve, 2500);
    });
  }
  const manifest = await fetch("./manifest.json", {cache: "no-store"}).then(function (r) { return r.json(); });
  const main = manifest.entries.find(function (e) { return e.url === manifest.start_url; })
    || manifest.entries.find(function (e) { return e.path.endsWith(".html"); });
  if (!main) throw new Error("No game HTML in manifest.");
  const base = new URL(main.path, window.location.href);
  base.pathname = base.pathname.slice(0, base.pathname.lastIndexOf("/") + 1);
  let html = await fetch(base.href, {cache: "no-store"}).then(function (r) { return r.text(); });
  const baseTag = '<base href="' + base.href + '">';
  html = /<head[^>]*>/i.test(html)
    ? html.replace(/<head[^>]*>/i, function (tag) { return tag + baseTag; })
    : baseTag + html;
  status.remove();
  frame.srcdoc = html;
})().catch(function (error) {
  document.getElementById("status").textContent = String(error);
});
]]></script>
</body>
</html>
