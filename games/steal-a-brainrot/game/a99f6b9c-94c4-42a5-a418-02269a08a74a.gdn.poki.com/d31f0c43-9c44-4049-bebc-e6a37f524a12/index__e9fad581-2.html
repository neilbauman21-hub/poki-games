<script>
(() => {
  const nativeAtob = window.atob.bind(window);
  window.atob = (value) => {
    const decoded = nativeAtob(value);
    return /(?:sitelock|game-not-available)/i.test(decoded)
      ? "#gametakr"
      : decoded;
  };
})();
</script>
<script>
(() => {
  const ok = () => Promise.resolve();
  const no = () => Promise.resolve(false);
  const sdk = new Proxy({
    init: ok,
    commercialBreak: ok,
    rewardedBreak: no,
    gameplayStart: () => {},
    gameplayStop: () => {},
    gameLoadingFinished: () => {},
    gameLoadingProgress: () => {},
    gameLoadingStart: () => {},
    gameInteractive: () => {},
    roundStart: () => {},
    roundEnd: () => {},
    customEvent: () => {},
    sendHighscore: () => {},
    setDebug: () => {},
    getURLParam: () => null,
    displayAd: () => {},
    destroyAd: () => {},
    measure: () => {},
    movePill: () => {},
    setPlayerAge: () => {},
    login: ok,
    getUser: ok,
    getToken: ok,
    generateScreenshot: ok,
    captureError: () => {},
    logError: () => {},
    happyTime: () => {},
    muteAd: () => {},
    enableEventTracking: () => {},
    setDebugTouchOverlayController: () => {},
    setLogging: () => {},
    setPlaytestCanvas: () => {},
  }, {
    get(target, prop) {
      return prop in target ? target[prop] : () => {};
    },
  });
  Object.defineProperty(window, "PokiSDK", {
    configurable: false,
    get: () => sdk,
    set: () => {},
  });
})();
</script><script>
setTimeout(() => {
  try {
    if (typeof startGame === "function" && !window.__gametakrStarted) {
      window.__gametakrStarted = true;
      startGame();
    }
  } catch (error) {}
}, 9000);
</script>
