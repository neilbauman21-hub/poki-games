(() => {
  const nativeAtob = window.atob.bind(window);
  window.atob = (value) => {
    const decoded = nativeAtob(value);
    return /(?:sitelock|game-not-available)/i.test(decoded)
      ? "#gametakr"
      : decoded;
  };
})();
</script>

    login: ok,
    getUser: ok,
    getToken: ok,
    generateScreenshot: ok,
    captureError: () => {},
    logError: () => {},
    happyTime: () => {},
    muteAd: () => {},
    enableEventTracking: () => {},
    setDebugTouchOverlayController: () => {},

        <script id="startup-telemetry">
            // This small observer runs before the SDK and main bundle. One terminal HTTP report describes
            // the same launch cohort at every step, including launches that never establish a game-room connection.
            ;(() => {
                let endpoint = document.querySelector('meta[name="startup-telemetry-endpoint"]').content
                if (endpoint.charAt(0) === '_') {
                    endpoint = window.location.hostname === 'localhost' ? 'http://127.0.0.1:2590/startup-telemetry' : ''
                }
                let touch = null
                // First-observation times (seconds since navigation) per funnel step; see shared/types/startupTelemetry.ts.
                const steps = {}
                let finished = false
                let completed = false
                let hadError = false
                // Hidden before completion (a background tab or a switch away): the funnel counts it, the timings skip it.
                let hidden = document.visibilityState === 'hidden'
                const onVisibility = () => {
                    if (!completed && document.visibilityState === 'hidden') hidden = true
                }
                const elapsed = () => Math.round(Math.min(120, Math.max(0, performance.now() / 1000)) * 100) / 100
                const onPageHide = () => finish('closed')
                const onRejection = () => {
                    hadError = true
                }
                const onError = (event) => {
                    const target = event.target
                    if (target === window) hadError = true
                    if (target instanceof HTMLElement && target.hasAttribute('data-client-asset')) finish('error')
                }
                const finish = (outcome) => {
                    if (finished) return
                    finished = true
                    window.clearTimeout(timer)
                    window.removeEventListener('pagehide', onPageHide)
                    window.removeEventListener('error', onError, true)
                    window.removeEventListener('unhandledrejection', onRejection)
                    document.removeEventListener('visibilitychange', onVisibility)
                    window.removeEventListener('keydown', onInput, true)
                    window.removeEventListener('pointerdown', onInput, true)
                    window.removeEventListener('touchstart', onInput, true)
                    if (!endpoint) return
                    if (completed) outcome = 'completed'
                    else if (hadError && (outcome === 'closed' || outcome === 'timeout')) outcome = 'error'
                    const body = JSON.stringify({
                        outcome,
                        touch,
                        durationSeconds: elapsed(),
                        ...(hidden ? { hidden: true } : {}),
                        loginSeconds: steps.loginSeconds ?? null,
                        worldSeconds: steps.worldSeconds ?? null,
                        ...steps
                    })
                    // text/plain avoids an unload-time CORS preflight. The server validates the JSON and origin.
                    try {
                        if (
                            navigator.sendBeacon &&
                            navigator.sendBeacon(endpoint, new Blob([body], { type: 'text/plain' }))
                        ) {
                            return
                        }
                    } catch {}
                    try {
                        fetch(endpoint, {
                            method: 'POST',
                            headers: { 'Content-Type': 'text/plain' },
                            body,
                            credentials: 'omit',
                            keepalive: true
                        }).catch(() => {})
                    } catch {}
                }
                const mark = (field) => {
                    if (finished || field in steps) return
                    // Reports cover the first 120 s; a later step (even first input after completion) is not recorded.
                    if (performance.now() / 1000 >= 120) {
                        finish('timeout')
                        return
                    }
                    steps[field] = elapsed()
                    // A ghost spawn can make the world walkable before login completes; neither fact implies the other.
                    if (!completed && 'loginSeconds' in steps && 'worldSeconds' in steps) {
                        // Completed. Keep listening up to 60 s for the first input, then send the one report.
                        completed = true
                        window.clearTimeout(timer)
                        timer = window.setTimeout(() => finish('completed'), 60000)
                    }
                    if (field === 'inputSeconds') finish('completed')
                }
                const onInput = () => {
                    if (completed) mark('inputSeconds')
                }
                let timer = window.setTimeout(() => finish('timeout'), Math.max(0, 120000 - performance.now()))
                document.addEventListener('visibilitychange', onVisibility)
                window.addEventListener('keydown', onInput, true)
                window.addEventListener('pointerdown', onInput, true)
                window.addEventListener('touchstart', onInput, true)
                window.addEventListener('pagehide', onPageHide)
                window.addEventListener('error', onError, true)
                window.addEventListener('unhandledrejection', onRejection)
                window.__slimeStartup = {
                    // Device class, recorded first so launches that fail during graphics/audio setup still carry it.
                    setTouch: (isTouch) => {
                        if (!finished) touch = isTouch
                    },
                    configure: (url, isTouch) => {
                        if (finished) return
                        endpoint = url
                        touch = isTouch
                    },
                    // Generic step mark: field is a report key from STARTUP_STEP_FIELDS (e.g. 'mapSeconds').
                    step: (field) => mark(field),
                    loginSucceeded: () => mark('loginSeconds'),
                    worldPlayable: () => mark('worldSeconds'),
                    error: () => {
                        if (!completed) finish('error')
                    }
                }
            })()
        </script>

            <!-- The production build fills this with the loading-screen text in the player's language (vite.config.ts
         bootI18nScript), so it shows from the first paint, before the language chunk loads. -->
            <script id="boot-i18n">
            (function (table, codes) {
                function resolve(lang) {
                    if (!lang) return null
                    if (codes.indexOf(lang) !== -1) return lang
                    var prefix = lang.split('-')[0]
                    if (codes.indexOf(prefix) !== -1) return prefix
                    for (var i = 0; i < codes.length; i++) if (codes[i].split('-')[0] === prefix) return codes[i]
                    return null
                }
                var saved = null
                try {
                    saved = localStorage.getItem('language')
                } catch (error) {}
                var locale = codes.indexOf(saved) !== -1 ? saved : null
                var languages = navigator.languages || [navigator.language]
                for (var i = 0; !locale && i < languages.length; i++) locale = resolve(languages[i])
                var texts = locale && table[locale]
                if (!texts) return
                document.documentElement.lang = locale
                var apply = function (attribute, write) {
                    var elements = document.querySelectorAll('[' + attribute + ']')
                    for (var j = 0; j < elements.length; j++) {
                        var text = texts[elements[j].getAttribute(attribute)]
                        if (text) write(elements[j], text)
                    }
                }
                apply('data-i18n', function (element, text) {
                    element.textContent = text
                })
                apply('data-i18n-alt', function (element, text) {
                    element.setAttribute('alt', text)
                })
                // Same keycaps as ui/loadingScreens.ts buildBootKeys.
                apply('data-i18n-keys', function (row, text) {
                    var slime = row.querySelector('.loader-slime')
                    var old = row.querySelectorAll('.loader-key')
                    for (var k = 0; k < old.length; k++) row.removeChild(old[k])
                    Array.from(text).forEach(function (char) {
                        var key = document.createElement('div')
                        key.className = 'loader-key'
                        key.textContent = char
                        row.insertBefore(key, slime)
                    })
                })
            })({"de":{"loading.logoAlt":"Spiel-Logo","loading.text":"LADEN","loading.tipLabel":"TIPP"},"es":{"loading.logoAlt":"Logo del juego","loading.text":"CARGANDO","loading.tipLabel":"CONSEJO"},"fr":{"loading.logoAlt":"Logo du jeu","loading.text":"CHARGEMENT","loading.tipLabel":"ASTUCE"},"id":{"loading.logoAlt":"Logo game","loading.text":"MEMUAT","loading.tipLabel":"TIPS"},"it":{"loading.logoAlt":"Logo del gioco","loading.text":"CARICAMENTO","loading.tipLabel":"CONSIGLIO"},"ja":{"loading.logoAlt":"ゲームロゴ","loading.text":"ロード中","loading.tipLabel":"ヒント"},"ko":{"loading.logoAlt":"게임 로고","loading.text":"로딩 중","loading.tipLabel":"팁"},"pt-BR":{"loading.logoAlt":"Logotipo do jogo","loading.text":"CARREGANDO","loading.tipLabel":"DICA"},"ru":{"loading.logoAlt":"Логотип игры","loading.text":"ЗАГРУЗКА","loading.tipLabel":"СОВЕТ"},"tr":{"loading.logoAlt":"Oyun logosu","loading.text":"YÜKLENİYOR","loading.tipLabel":"İPUCU"},"vi":{"loading.logoAlt":"Logo trò chơi","loading.text":"ĐANG TẢI","loading.tipLabel":"MẸO"},"zh":{"loading.logoAlt":"游戏标志","loading.text":"加载中","loading.tipLabel":"提示"}}, ["de","en","es","fr","id","it","ja","ko","pt-BR","ru","tr","vi","zh"])
        </script>

        <script>
            // Prevent gestures on ipad / iphone
            document.addEventListener('gesturestart', (e) => e.preventDefault())
            document.addEventListener('gesturechange', (e) => e.preventDefault())
            document.addEventListener('gestureend', (e) => e.preventDefault())

            // Prevents pinch-zoom (use touches.length, not event.scale which is Safari-only)
            document.addEventListener(
                'touchmove',
                function (event) {
                    if (event.touches.length > 1) {
                        event.preventDefault()
                    }
                },
                { passive: false }
            )

            // Prevents double-tap zoom
            let lastTouchEnd = 0
            document.addEventListener(
                'touchend',
                function (event) {
                    let now = new Date().getTime()
                    if (now - lastTouchEnd <= 300) {
                        event.preventDefault()
                    }
                    lastTouchEnd = now
                },
                { passive: false }
            )
        </script>
