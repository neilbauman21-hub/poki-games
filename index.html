<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Poki Offline Hub</title>
<style>
:root{--bg:#0b0d10;--card:#151a20;--line:#28313b;--text:#edf3f7;--muted:#8e9baa;--accent:#83ffe7}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,sans-serif}
header{padding:28px 24px 18px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:clamp(24px,4vw,44px);letter-spacing:-.04em}
p{margin:8px 0 0;color:var(--muted)}
#tools{display:flex;gap:10px;padding:16px 24px;border-bottom:1px solid var(--line)}
#search{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:10px 12px;font:inherit}
#count{color:var(--muted);white-space:nowrap;align-self:center}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;padding:20px 24px 40px}
.card{display:flex;flex-direction:column;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--text);text-decoration:none;transition:transform .12s,border-color .12s}
.card:hover{transform:translateY(-2px);border-color:var(--accent)}
.card b{font-size:14px;line-height:1.25}.card span{color:var(--muted);font-size:12px}
.thumb{aspect-ratio:16/10;border-radius:8px;background:linear-gradient(135deg,#24313c,#11161c);display:grid;place-items:center;color:var(--accent);font-weight:800;font-size:24px}
#overlay{position:fixed;inset:0;background:#05070a;display:none;flex-direction:column;z-index:10}
#overlay.open{display:flex}
#bar{display:flex;align-items:center;gap:12px;padding:8px 12px;border-bottom:1px solid var(--line)}
#bar b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#bar button{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
#frame{flex:1;border:0;width:100%;background:#000}
</style>
</head>
<body>
<header><h1>Poki Offline Hub</h1><p>Public archive. Games run from GitHub Pages; assets are mirrored in the public repo for jsDelivr.</p></header>
<div id="tools"><input id="search" placeholder="Search games..." autocomplete="off"><span id="count"></span></div>
<main id="grid"></main>
<div id="overlay"><div id="bar"><b id="playing"></b><button id="close">Close</button></div><iframe id="frame" allow="autoplay; fullscreen; gamepad; accelerometer; gyroscope" allowfullscreen></iframe></div>
<script>
const games = [{"slug":"master-chess","title":"Master Chess"},{"slug":"subway-surfers","title":"Subway Surfers Web"},{"slug":"minefun-io","title":"MineFun.io - Play Free Online Cube Games"},{"slug":"tag","title":"tag"},{"slug":"cryzen-io","title":"Cryzen.io - Online Multiplayer Shooter Game"},{"slug":"basketball-stars","title":"Basketball Legends"},{"slug":"drift-boss","title":"Drift Boss"},{"slug":"retro-bowl","title":"Retro Bowl"},{"slug":"monkey-mart","title":"MonkeyMart"},{"slug":"blocky-blast-puzzle","title":"blocky-puzzle 1.0"},{"slug":"level-devil","title":"Level Devil 1.5.0"},{"slug":"steal-a-brainrot","title":"Steal and Run"},{"slug":"slime-keyboard-escape","title":"Slime Keyboard Escape"},{"slug":"hide-and-paint","title":"Hide and paint - Gate Fixes"},{"slug":"dino-simulator","title":"Dino Simulator"},{"slug":"tnt-sandbox","title":"TNT SANDBOX \u2014 voxel demolition range"},{"slug":"crown-hunters","title":"CROWN HUNTERS"},{"slug":"nuke-policy","title":"NUKE POLICY \u2014 Territory Battle"},{"slug":"drive-mad","title":"Drive Mad"}];
const grid=document.getElementById("grid"),count=document.getElementById("count"),overlay=document.getElementById("overlay"),frame=document.getElementById("frame"),playing=document.getElementById("playing");
function render(){const q=document.getElementById("search").value.trim().toLowerCase();const shown=games.filter(g=>g.title.toLowerCase().includes(q));grid.innerHTML="";for(const g of shown){const a=document.createElement("a");a.className="card";a.href="games/"+g.slug+"/index.html";a.innerHTML='<div class="thumb">'+g.title.slice(0,2).toUpperCase()+'</div><b></b><span></span>';a.querySelector("b").textContent=g.title;a.querySelector("span").textContent=g.slug;a.addEventListener("click",e=>{e.preventDefault();playing.textContent=g.title;frame.src=a.href;overlay.classList.add("open")});grid.appendChild(a)}count.textContent=shown.length+" games"}
document.getElementById("close").addEventListener("click",()=>{overlay.classList.remove("open");frame.src="about:blank"});
document.getElementById("search").addEventListener("input",render);render();
</script>
</body>
</html>
